<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page title, description, canonical URL and social preview text; filled in by scripts/prerender.mjs -->
    <!--app-head-->
    <meta name="author" content="Saleh Ahmad" />
    <meta name="theme-color" content="#0E3B33" />
    <!-- Google Search Console ownership check; must stay in place -->
    <meta name="google-site-verification" content="73uIIcXu8JMOkyVKc6XCg6hnD37jEQz5_Z5M4TXC9vg" />
    
    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social previews (Facebook, LinkedIn, WhatsApp, X) -->
    <meta property="og:site_name" content="Saleh Ahmad" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: connect early and load without blocking on a CSS @import -->

    <!-- Structured data for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "AccountingService",
            "@id": "%SITE_URL%/#business",
            "name": "Saleh Ahmad",
            "description": "Online bookkeeping, payroll, tax preparation and QuickBooks services. Based in Weatherford, Texas, serving businesses across Texas, the United States and worldwide.",
            "url": "%SITE_URL%/",
            "image": "%SITE_URL%/og-image.png",
            "logo": "%SITE_URL%/icon-512.png",
            "email": "saleh@selawii.com",
            "telephone": "+1-682-239-7650",
            "address": { "@type": "PostalAddress", "addressLocality": "Weatherford", "addressRegion": "TX", "addressCountry": "US" },
            "areaServed": [{ "@type": "State", "name": "Texas" }, { "@type": "Country", "name": "United States" }, "Worldwide"],
            "founder": { "@id": "%SITE_URL%/#saleh" },
            "sameAs": ["https://www.linkedin.com/in/saleh-ahmad-57807142/"],
            "knowsAbout": ["Accounting system design", "Internal controls", "Excel financial reporting", "Bookkeeping", "Texas franchise tax", "Texas sales tax", "Payroll", "Tax preparation", "Tax planning", "QuickBooks Online", "QuickBooks Desktop", "Financial statements", "Cost accounting", "Internal audit", "IFRS", "Islamic finance", "Zakat accounting"],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Accounting services",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Accounting system setup", "description": "A complete accounting system with every transaction controlled from A to Z, internal controls and approvals, and clear Excel reports." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Bookkeeping", "description": "Bank and card reconciliation, payables and receivables, and monthly financial statements." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Payroll", "description": "Salaries and wages processed accurately and on time with QuickBooks Payroll." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Tax preparation and planning", "description": "Returns prepared from clean books, deductions claimed and filings kept compliant." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "QuickBooks setup, cleanup and training", "description": "QuickBooks Online or Desktop set up, brought up to date, and taught to your team." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Islamic finance and Zakat accounting", "description": "Zakat calculation and Sharia-compliant accounting." } }
              ]
            }
          },
          {
            "@type": "Person",
            "@id": "%SITE_URL%/#saleh",
            "name": "Saleh Ahmad",
            "jobTitle": "Certified Accountant",
            "url": "%SITE_URL%/",
            "sameAs": ["https://www.linkedin.com/in/saleh-ahmad-57807142/"],
            "hasCredential": [
              { "@type": "EducationalOccupationalCredential", "name": "Arab Certified Professional Accountant (ACPA)" },
              { "@type": "EducationalOccupationalCredential", "name": "CIMA Islamic Finance Diploma" },
              { "@type": "EducationalOccupationalCredential", "name": "Zakat Accounting Diploma" }
            ],
            "alumniOf": { "@type": "CollegeOrUniversity", "name": "Nagpur University" }
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Saleh Ahmad",
            "publisher": { "@id": "%SITE_URL%/#business" },
            "inLanguage": "en"
          }
        ]
      }
    </script>

    <!-- Without JavaScript, show content that would otherwise fade in on scroll -->
    <noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
